<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StringPulse - Tennis String Diagnostic App</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --accent: #16a34a;
      --accent-hover: #15803d;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --nav-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    header { background: var(--card-bg); padding: 14px; text-align: center; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.3rem; margin: 0; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
    .container { flex: 1; max-width: 500px; width: 100%; margin: 0 auto; padding: 16px; padding-bottom: 85px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; margin-bottom: 16px; }
    button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .kpi-card { background: #f8fafc; padding: 14px 10px; border-radius: 8px; text-align: center; border: 1px solid #e2e8f0; }
    .kpi-val { font-size: 1.9rem; font-weight: 800; color: var(--accent); margin: 4px 0; }
    canvas { width: 100%; height: 90px; background: #0f172a; border-radius: 8px; margin-top: 12px; }
  </style>
</head>
<body>

<header>
  <h1>StringPulse</h1>
</header>

<div class="container">
  <div class="card" style="text-align: center;">
    <button id="listenBtn">🎙️️ Start Listening for Taps</button>
    <p id="statusText" style="font-size: 0.85rem; color: var(--muted); margin-top: 10px;">
      Hold frame firmly in air and tap central mains with a pen cap.
    </p>
    <canvas id="waveform"></canvas>
  </div>

  <div class="card">
    <div class="kpi-grid">
      <div class="kpi-card">
        <label style="font-size: 0.75rem; color: var(--muted);">ESTIMATED TENSION</label>
        <div class="kpi-val" id="tensionVal">-- <span style="font-size: 1rem">lbs</span></div>
        <div id="freqVal" style="font-size: 0.8rem; color: var(--muted)">-- Hz</div>
      </div>
      <div class="kpi-card">
        <label style="font-size: 0.75rem; color: var(--muted);">STRING ELASTICITY</label>
        <div class="kpi-val" id="resilienceVal">-- %</div>
        <div id="healthBadge" style="background: #e2e8f0; color: #475569; font-size: 0.75rem; font-weight: bold; padding: 4px; border-radius: 4px;">READY</div>
      </div>
    </div>
  </div>
</div>

<script>
  let audioCtx, analyser, micStream, filterNode;
  let isListening = false;
  let lastTapTime = 0;
  let isProcessingStrike = false;

  const listenBtn = document.getElementById('listenBtn');
  const statusText = document.getElementById('statusText');
  const tensionVal = document.getElementById('tensionVal');
  const freqVal = document.getElementById('freqVal');
  const resilienceVal = document.getElementById('resilienceVal');
  const healthBadge = document.getElementById('healthBadge');
  const canvas = document.getElementById('waveform');
  const canvasCtx = canvas.getContext('2d');

  listenBtn.addEventListener('click', async () => {
    if (!isListening) {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
        });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.setValueAtTime(220, audioCtx.currentTime);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 8192;
        analyser.smoothingTimeConstant = 0.0; // Raw real-time decay capture

        const source = audioCtx.createMediaStreamSource(micStream);
        source.connect(filterNode);
        filterNode.connect(analyser);

        isListening = true;
        listenBtn.innerText = '🛑 Stop Listening';
        listenBtn.style.background = '#dc2626';
        statusText.innerText = 'Listening... Tap central mains firmly.';
        processAudio();
      } catch (err) {
        alert('Microphone error: ' + err.message);
      }
    } else {
      stopListening();
    }
  });

  function stopListening() {
    isListening = false;
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    listenBtn.innerText = '🎙️ Start Listening for Taps';
    listenBtn.style.background = '#16a34a';
    statusText.innerText = 'Stopped listening.';
  }

  function getAmplitude() {
    const timeBuffer = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(timeBuffer);
    let maxAmp = 0;
    for (let i = 0; i < timeBuffer.length; i++) {
      if (Math.abs(timeBuffer[i]) > maxAmp) maxAmp = Math.abs(timeBuffer[i]);
    }
    return { maxAmp, timeBuffer };
  }

  function processAudio() {
    if (!isListening) return;

    const { maxAmp, timeBuffer } = getAmplitude();
    drawWaveform(timeBuffer);

    const now = Date.now();
    if (maxAmp > 0.03 && (now - lastTapTime > 800) && !isProcessingStrike) {
      isProcessingStrike = true;
      lastTapTime = now;

      // TIME-DECAY ELASTICITY ENGINE:
      // Sample 1: Baseline initial post-transient vibration amplitude (t = 40ms)
      setTimeout(() => {
        const initialAmp = getAmplitude().maxAmp;

        // Sample 2: Residual fundamental vibration amplitude after 150ms decay (t = 190ms)
        setTimeout(() => {
          const decayedAmp = getAmplitude().maxAmp;
          
          // True physical damping ratio (Q-factor decay)
          let dampingRatio = initialAmp > 0 ? (decayedAmp / initialAmp) : 0;
          
          analyzePitchAndElasticity(dampingRatio);
          isProcessingStrike = false;
        }, 150);

      }, 40);
    }

    requestAnimationFrame(processAudio);
  }

  function analyzePitchAndElasticity(dampingRatio) {
    if (!isListening) return;

    const bufferLength = analyser.frequencyBinCount;
    const freqData = new Float32Array(bufferLength);
    analyser.getFloatFrequencyData(freqData);

    const binWidth = audioCtx.sampleRate / analyser.fftSize;
    const minBin = Math.floor(100 / binWidth);
    const maxBin = Math.ceil(200 / binWidth);

    let maxDb = -Infinity;
    let peakBin = -1;

    for (let i = minBin; i <= maxBin; i++) {
      if (freqData[i] > maxDb) {
        maxDb = freqData[i];
        peakBin = i;
      }
    }

    if (peakBin > 0 && maxDb > -65) {
      const alpha = freqData[peakBin - 1];
      const beta = freqData[peakBin];
      const gamma = freqData[peakBin + 1];
      const delta = (gamma - alpha) / (2 * (2 * beta - alpha - gamma));
      
      const exactBin = peakBin + delta;
      const exactFrequency = exactBin * binWidth;

      calculateAndDisplay(exactFrequency, dampingRatio);
    }
  }

  function calculateAndDisplay(frequencyHz, dampingRatio) {
    const kFactor = 0.00025;
    const headSizeSqIn = 102;
    const tensionLbs = Math.pow(frequencyHz, 2) * (headSizeSqIn / 100) * kFactor;

    // SCIENTIFIC ELASTICITY CALCULATION:
    // Damping Ratio > 0.35 indicates long sustain (Fresh/Elastic string)
    // Damping Ratio < 0.15 indicates fast decay (Dead/Plasticized string)
    let elasticityScore = Math.round(Math.min(100, Math.max(40, (dampingRatio / 0.40) * 100)));

    tensionVal.innerHTML = `${tensionLbs.toFixed(1)} <span style="font-size: 1rem">lbs</span>`;
    freqVal.innerText = `${frequencyHz.toFixed(1)} Hz (Central Mains)`;
    resilienceVal.innerText = `${elasticityScore} %`;

    if (elasticityScore >= 80) {
      healthBadge.innerText = 'FRESH / ELASTIC';
      healthBadge.style.background = '#dcfce7';
      healthBadge.style.color = '#15803d';
    } else if (elasticityScore >= 60) {
      healthBadge.innerText = 'AGING ELASTICITY';
      healthBadge.style.background = '#fef3c7';
      healthBadge.style.color = '#b45309';
    } else {
      healthBadge.innerText = 'DEAD / REPLACE';
      healthBadge.style.background = '#fee2e2';
      healthBadge.style.color = '#b91c1c';
    }

    statusText.innerText = `Decay ratio: ${dampingRatio.toFixed(2)}. Tap again to re-test.`;
  }

  function drawWaveform(buffer) {
    canvasCtx.fillStyle = '#0f172a';
    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
    canvasCtx.lineWidth = 2;
    canvasCtx.strokeStyle = '#22c55e';
    canvasCtx.beginPath();

    const sliceWidth = canvas.width / buffer.length;
    let x = 0;

    for (let i = 0; i < buffer.length; i++) {
      const v = buffer[i] * 2;
      const y = (v * canvas.height / 2) + (canvas.height / 2);
      if (i === 0) canvasCtx.moveTo(x, y);
      else canvasCtx.lineTo(x, y);
      x += sliceWidth;
    }
    canvasCtx.lineTo(canvas.width, canvas.height / 2);
    canvasCtx.stroke();
  }
</script>
</body>
</html>
